# Посты в личный Threads (@shoot.kin) — две очереди: slowframes раз в три дня,
# атлас каждый день, кроме дней slowframes.
# 11:00 UTC = 19:00 по Бали, 14:00 по Москве. Cron ежедневный, а интервал
# держит сам publish.py по времени последней публикации: «*/3» в cron на
# стыке месяцев даёт то три дня, то один. Кадры Threads забирает по
# raw-ссылкам этого репозитория, поэтому он публичный.
#
# Порядок шагов важен: slowframes первым. Если он опубликовал сегодня,
# атлас это видит и ждёт завтра — посты чередуются, а не выходят парой.
# Падение одной очереди не останавливает другую (if: always()).
name: threads-daily
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      queue:
        description: 'Какая очередь'
        type: choice
        options: [slowframes, atlas]
        default: slowframes
      dry:
        description: 'Холостой прогон: показать, что ушло бы, ничего не отправлять'
        type: boolean
        default: true
      force:
        description: 'Опубликовать сейчас, не дожидаясь трёх дней'
        type: boolean
        default: false
      id:
        description: 'Конкретный пост (папка в очереди) вне очереди и паузы'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      THREADS_RU_ACCESS_TOKEN: ${{ secrets.THREADS_RU_ACCESS_TOKEN }}
      # Интервал у каждой очереди свой — в publish.py (QUEUES[...]['days'])
      POST_ID: ${{ inputs.id }}
      DRY: ${{ inputs.dry }}
      FORCE: ${{ inputs.force }}
      EVENT: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish slowframes
        if: github.event_name == 'schedule' || inputs.queue == 'slowframes'
        run: |
          args="--queue slowframes"
          [ -n "$POST_ID" ] && args="$args --id $POST_ID"
          [ "$FORCE" = "true" ] && args="$args --force"
          if [ "$EVENT" = "schedule" ] || [ "$DRY" = "false" ]; then
            python3 publish.py $args
          else
            python3 publish.py --dry $args
          fi
      - name: Publish atlas
        if: always() && (github.event_name == 'schedule' || inputs.queue == 'atlas')
        run: |
          args="--queue atlas"
          [ -n "$POST_ID" ] && args="$args --id $POST_ID"
          [ "$FORCE" = "true" ] && args="$args --force"
          if [ "$EVENT" = "schedule" ] || [ "$DRY" = "false" ]; then
            python3 publish.py $args
          else
            python3 publish.py --dry $args
          fi
      - name: Save state
        if: always()
        # Пуш пробуем несколько раз: 23.09.2026 GitHub на секунду ответил
        # 500-й ошибкой ровно на этом шаге. Отметка «пост вышел» не
        # записалась, и на следующий день бот счёл пост неопубликованным
        # и отправил его в Threads повторно. Ретраи с паузой закрывают
        # именно разовые сбои GitHub; если сервер лежит по-настоящему
        # дольше минуты, шаг просто упадёт, как раньше.
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@shootkin.com"
          git add state/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "state: опубликован пост"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "пуш прошёл с попытки $attempt"
              exit 0
            fi
            echo "попытка $attempt не удалась, жду и пробую снова"
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::пуш состояния не прошёл после пяти попыток — проверить руками, не остался ли пост неотмеченным"
          exit 1
